<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hair Design Charis ご予約</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://static.line-scdn.net">
<style>
  html, body { margin: 0; height: 100%; background: #faf7f3; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }
  .msg { font-family: sans-serif; color: #3b3431; padding: 32px 24px; line-height: 1.9; font-size: 16px; display: none; }
  .msg a { display: block; margin-top: 18px; text-align: center; background: #06c755; color: #fff; text-decoration: none; border-radius: 99px; padding: 14px; font-weight: bold; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #8a7f79; font-size: 14px; letter-spacing: .08em; }
  #loading .dot { width: 34px; height: 34px; border: 3px solid #e8e0d8; border-top-color: #b89f8c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- Hair Design Charis 予約ページ:LINEの中(LIFF)で開き、Apps Scriptの予約ページをこのページの中に表示します -->
<div id="loading"><div class="dot"></div>読み込み中…</div>
<iframe id="app" title="Hair Design Charis ご予約"></iframe>
<div class="msg" id="msg"></div>
<noscript><p class="msg" style="display:block">このページを表示するには、JavaScriptを有効にしてください。</p></noscript>
<script>
  // Apps Scriptの予約ページURL(…/exec)。デプロイは「新バージョン」で更新するので、このURLは変わりません
  var APP_URL = 'https://script.google.com/macros/s/AKfycby40wQVWLCrWFOfamZ2ryvnyEZa9BPw5fQ1uVg5Vup7u9kLEJJzRwlRSGbaf6w-avoa/exec';
  // LINEの中で開くためのID(LINEログインのチャネルのLIFF)
  var LIFF_ID = '2011759361-YYLlor1e';
  var LIFF_URL = 'https://liff.line.me/' + LIFF_ID;
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var inLine = /\bLine\//i.test(navigator.userAgent); // LINEアプリの中のブラウザ
  var done = false;

  function hideLoading() { var l = document.getElementById('loading'); if (l) l.style.display = 'none'; }
  function showMsg(html) {
    done = true; hideLoading();
    document.getElementById('app').style.display = 'none';
    var m = document.getElementById('msg'); m.innerHTML = html; m.style.display = 'block';
  }
  function lineUrl() {
    // 「?q=記号」などはそのまま引き継ぐ
    var q = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && !/^(lx|liff\.state)=/.test(x); });
    // LINEの入口(liff.line.me)を通ってSafariに来たときは、記号が liff.state の中に入っている
    var st = location.search.match(/[?&]liff\.state=([^&]*)/);
    if (st) {
      try {
        var inner = decodeURIComponent(st[1]).replace(/^[^?]*\?/, '');
        inner.split('&').forEach(function (x) { if (x && !/^lx=/.test(x) && q.indexOf(x) < 0) q.push(x); });
      } catch (e) {}
    }
    return LIFF_URL + (q.length ? '?' + q.join('&') : '');
  }
  function showOpenInLine() {
    showMsg('<p>ネット予約は、スマホのLINEアプリからご利用いただけます。</p>' +
      (mobile ? '<p>下のボタンを押すと、LINEで予約ページが開きます。</p><a href="' + lineUrl() + '">LINEで開く</a>'
              : '<p>スマホで、お店のLINEのトーク画面の「ネット予約」ボタンから開いてください。</p>'));
  }
  // 「?q=記号」「?b=予約の番号」などを、そのまま予約ページに渡す(LINEの確認用のしるしを足す)
  function openApp(extra) {
    var q = location.search.replace(/^\?/, '').split('&').filter(function (x) { return x && !/^(lx|liff\.state)=/.test(x); });
    q = q.concat(extra);
    var f = document.getElementById('app');
    f.onload = hideLoading;
    f.src = APP_URL + (q.length ? '?' + q.join('&') : '');
    done = true;
  }

  // SafariなどLINEの外で開いたとき:LINEの部品を読み込む前に、すぐLINEで開き直す
  // (Safariのプライバシー保護でLINEの部品が止められても、真っ白にならないように)
  if (!inLine && mobile && !/[?&]lx=1/.test(location.search) && !/[?&]liff\.state=/.test(location.search)) {
    var sep = lineUrl().indexOf('?') >= 0 ? '&' : '?';
    location.replace(lineUrl() + sep + 'lx=1');
    setTimeout(showOpenInLine, 2500); // 開き直せなかったときの案内
  } else if (!inLine && !mobile) {
    showOpenInLine(); // パソコンで開いたとき
  } else {
    // LINEの中(または開き直し後):LINEの部品を読み込んで、お客様を確認してから予約ページを表示
    var s = document.createElement('script');
    s.charset = 'utf-8';
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onerror = function () {
      if (!inLine) { showOpenInLine(); return; }
      showMsg('<p>ページを開けませんでした。通信の良い場所で、もう一度開き直してください。</p><a href="' + lineUrl() + '">もう一度開く</a>');
    };
    s.onload = start;
    document.head.appendChild(s);
    // LINEの外(写真アプリのQRからSafariで開いた等)で止まったときは、早めにLINEへの案内を出す
    if (!inLine) setTimeout(function () { if (!done) showOpenInLine(); }, 6000);
    // いつまでも開かないときの案内
    setTimeout(function () {
      if (!done) showMsg('<p>読み込みに時間がかかっています。お手数ですが、開き直してください。</p><a href="' + lineUrl() + '">もう一度開く</a>');
    }, 20000);
  }

  function start() {
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (/[?&]liff\.state=/.test(location.search)) return; // LINEが元のURLに戻すまで待つ
      if (!liff.isInClient()) { showOpenInLine(); return; }
      var tok = liff.getIDToken();
      if (!tok) { liff.login(); return; }
      return liff.getFriendship().then(function (f) { return !!f.friendFlag; }, function () { return true; }).then(function (friend) {
        openApp(['lt=' + encodeURIComponent(tok)].concat(friend ? [] : ['fr=0']));
      });
    }).catch(function () {
      showMsg('<p>ページを開けませんでした。お手数ですが、LINEアプリで開き直してください。</p><a href="' + lineUrl() + '">LINEで開く</a>');
    });
  }
</script>
</body>
</html>
